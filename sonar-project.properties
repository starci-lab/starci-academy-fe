sonar.projectKey=starci-academy-fe
sonar.projectName=StarCi Academy Frontend
sonar.host.url=https://sonar.starci.org
sonar.sourceEncoding=UTF-8
sonar.sources=src
sonar.tests=src
sonar.exclusions=**/*.spec.ts,**/*.spec.tsx,**/*.e2e-spec.*
sonar.test.inclusions=**/*.spec.ts,**/*.spec.tsx
sonar.test.exclusions=**/*.e2e-spec.*
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=**/*.spec.ts,**/*.spec.tsx,src/**/*.d.ts
sonar.typescript.tsconfigPaths=tsconfig.json
