name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint:check
      # Build BEFORE typecheck. Next.js generates the route-level `PageProps` and
      # `LayoutProps` types into .next/types during the build, and src/app/** refers
      # to them, so a typecheck on a clean checkout fails with "Cannot find name
      # 'PageProps'" on files that are perfectly correct. It passes locally only
      # because a previous build left those types behind.
      - run: npm run build
      - run: npm run typecheck
      - name: Unit tests with mature coverage
        env:
          COVERAGE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: npm run test:ci
      # E2E is a separate behavior lane and never contributes to Sonar coverage.
      - name: End-to-end behavior
        run: npm run test:e2e
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage/lcov.info
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Scan with SonarQube
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
      - name: Strict sonar-quality-gate proof
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 10
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
