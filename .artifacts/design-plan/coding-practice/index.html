<!doctype html>
<html lang="vi" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coding practice — preview 1.0</title>
<style>
:root{--bg:#0a0a0b;--surface:#141416;--sep:#2a2a30;--fg:#f4f4f5;--muted:#a1a1aa;--faint:#71717a;--accent:#7c5cff;--ok:#22c55e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif}
.bar{position:sticky;top:0;z-index:10;background:var(--surface);border-bottom:1px solid var(--sep);padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar b{font-size:13px;margin-right:auto}
.bar .ok{color:#5ee08a;font-size:11.5px;border:1px solid rgba(34,197,94,.4);border-radius:999px;padding:2px 9px}
.wrap{display:flex;min-height:calc(100vh - 46px)}
.rail{width:236px;flex:0 0 236px;border-right:1px solid var(--sep);padding:12px;overflow:auto;max-height:calc(100vh - 46px)}
.grp{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin:14px 0 6px}
.grp:first-child{margin-top:0}
a.s{display:block;padding:6px 9px;border-radius:7px;font-size:12.5px;color:var(--muted);text-decoration:none;cursor:pointer}
a.s:hover{background:#1c1c20;color:var(--fg)}
a.s.on{background:#1c1c20;color:var(--accent)}
.own{display:block;font-size:10px;color:var(--faint)}
.stage{flex:1;min-width:0;display:flex;flex-direction:column}
.meta{padding:8px 14px;border-bottom:1px solid var(--sep);font-size:11.5px;color:var(--faint);display:flex;gap:14px;flex-wrap:wrap}
iframe{flex:1;width:100%;border:0;background:var(--bg)}
select{background:#1c1c20;color:var(--fg);border:1px solid var(--sep);border-radius:7px;padding:4px 9px;font-size:12px}
</style>
</head>
<body>
<div class="bar">
  <b>case-coding-practice · direction-path-first · <span style="color:var(--accent)">revision 1.0</span></b>
  <span class="ok">typecheck 0</span><span class="ok">canon lint 0</span><span class="ok">build exit 0</span>
  <label style="font-size:12px;color:var(--muted)">viewport
    <select id="vp">
      <option value="100%">full</option>
      <option value="1280px">1280</option>
      <option value="768px">768</option>
      <option value="390px">390</option>
    </select>
  </label>
  <label style="font-size:12px;color:var(--muted)">theme
    <select id="th"><option value="dark">dark</option><option value="light">light</option></select>
  </label>
</div>
<div class="wrap">
  <nav class="rail" id="rail"></nav>
  <div class="stage">
    <div class="meta" id="meta"></div>
    <iframe id="frame" title="candidate"></iframe>
  </div>
</div>
<script>
/* The chrome renders NOTHING of its own: every state below is the exported candidate loaded
   through its own URL. There is no second CSS implementation here and no `state.html`. */
const STATES = [
  ["Hub", [
    ["hub-ready","Hub · có tiến độ","page CodingPracticeHubPage"],
    ["hub-resting","Hub · đang tải","block DomainMasteryGrid"],
    ["hub-fresh","Hub · chưa làm gì","page CodingPracticeHubPage"],
    ["hub-guest","Hub · khách","page CodingPracticeHubPage"],
    ["hub-progress-failed","Hub · hỏng tiến độ","block DomainMasteryGrid"]
  ]],
  ["Chủ đề", [
    ["domain-ready","Chủ đề · có bài","page CodingDomainPage"],
    ["domain-resting","Chủ đề · đang tải","block CodingProblemList"],
    ["domain-empty","Chủ đề · chưa có bài","block CodingProblemList"],
    ["domain-all-solved","Chủ đề · xong hết","block CodingProblemList"]
  ]],
  ["Bài · đọc và viết", [
    ["problem-idle","Bài · chưa nộp","page CodingProblemPage"],
    ["problem-resting","Bài · đang tải","block ProblemReadingColumn"],
    ["problem-hint","Bài · tab gợi ý","block ProblemReadingColumn"]
  ]],
  ["Bài · chín verdict + socket", [
    ["problem-pending","Đang xếp hàng","block JudgeStatusStrip"],
    ["problem-judging","Đang chấm","block JudgeStatusStrip"],
    ["problem-accepted","Accepted","block JudgeStatusStrip"],
    ["problem-wrong-answer","Sai kết quả","block JudgeStatusStrip"],
    ["problem-time-limit","Quá thời gian","block JudgeStatusStrip"],
    ["problem-memory-limit","Quá bộ nhớ","block JudgeStatusStrip"],
    ["problem-runtime-error","Lỗi khi chạy","block JudgeStatusStrip"],
    ["problem-compile-error","Lỗi biên dịch","block JudgeStatusStrip"],
    ["problem-internal-error","Máy chấm hỏng","block JudgeStatusStrip"],
    ["problem-socket-lost","Mất kết nối","block JudgeStatusStrip"]
  ]]
]
const rail = document.getElementById("rail")
const frame = document.getElementById("frame")
const meta = document.getElementById("meta")
let current = STATES[0][1][0]
const paint = () => {
  rail.innerHTML = ""
  for (const [group, rows] of STATES) {
    const h = document.createElement("div"); h.className = "grp"; h.textContent = group; rail.appendChild(h)
    for (const row of rows) {
      const a = document.createElement("a")
      a.className = "s" + (row[0] === current[0] ? " on" : "")
      a.innerHTML = row[1] + '<span class="own">' + row[2] + "</span>"
      a.onclick = () => { current = row; go() }
      rail.appendChild(a)
    }
  }
}
const go = () => {
  const theme = document.getElementById("th").value
  frame.src = "candidate/out/index.html?state=" + current[0] + "&theme=" + theme
  frame.style.maxWidth = document.getElementById("vp").value
  meta.textContent = ""
  for (const [k, v] of [["stateId", current[0]], ["owner", current[2]], ["locale", "vi"], ["theme", theme], ["fixture", "src/fixtures/coding.json"]]) {
    const s = document.createElement("span"); s.textContent = k + ": " + v; meta.appendChild(s)
  }
  paint()
}
document.getElementById("vp").onchange = go
document.getElementById("th").onchange = go
go()
</script>
</body>
</html>
